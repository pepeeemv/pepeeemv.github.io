<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...loading...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #33ff00; /* Verde retro brillante */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            /* Aumentamos el tamaño de la fuente para que destaque el Loading */
            font-size: 24px; 
            line-height: 1.5;
        }

        #terminal-container {
            padding: 40px; /* Más espacio a los bordes */
            height: 100%;
            box-sizing: border-box;
            text-shadow: 0 0 5px rgba(51, 255, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        .cursor {
            display: inline-block;
            width: 14px;
            height: 1.1em;
            background-color: #33ff00;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 5px rgba(51, 255, 0, 0.7);
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body class="crt">
    
    <div id="terminal-container">
        <div>
            <span id="prompt">pepe@system:~$ </span>
            <span id="loading-text"></span>
            <span id="spinner"></span>
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        const textElement = document.getElementById('loading-text');
        const spinnerElement = document.getElementById('spinner');
        
        const textToType = "Loading...";
        const spinnerFrames = ['|', '/', '-', '\\'];
        
        // Función para pausar la ejecución
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startTerminal() {
            // Pausa inicial para que no empiece instantáneamente
            await sleep(600);

            // 1. Escribir "Loading..." letra por letra
            for (let i = 0; i < textToType.length; i++) {
                textElement.textContent += textToType.charAt(i);
                // Velocidad de tecleo
                await sleep(100); 
            }
            
            // Espacio entre la palabra y el spinner
            textElement.textContent += " ";

            // 2. Iniciar la animación del spinner giratorio
            let frameIndex = 0;
            setInterval(() => {
                spinnerElement.textContent = spinnerFrames[frameIndex];
                frameIndex = (frameIndex + 1) % spinnerFrames.length;
            }, 150); // Velocidad a la que gira el spinner
        }

        // Ejecutar cuando se cargue la pantalla
        window.onload = startTerminal;
    </script>
</body>
</html>
